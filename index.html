<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FAF7F2">
  <title>番茄小站</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/beercss/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/beercss/beer.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="light">
  <a class="skip-link" href="#view">跳到内容</a>

  <div class="app">
    <nav class="rail" aria-label="主导航">
      <a class="rail-brand" href="#/" aria-label="番茄小站首页">
        <img src="assets/mark.svg" alt="" width="30" height="30">
        <span>番茄</span>
      </a>
      <div class="rail-links">
        <a href="#/" data-nav="home"><span class="rail-icon"><i>auto_stories</i></span><span>首页</span></a>
        <a href="#/category" data-nav="category"><span class="rail-icon"><i>explore</i></span><span>发现</span></a>
        <a href="#/shelf" data-nav="shelf"><span class="rail-icon"><i>bookmarks</i></span><span>书架</span></a>
        <a href="#/history" data-nav="history"><span class="rail-icon"><i>history</i></span><span>足迹</span></a>
      </div>
      <div class="rail-foot">
        <a href="#/dev" data-nav="dev"><span class="rail-icon"><i>terminal</i></span><span>接口</span></a>
        <a href="#/settings" data-nav="settings"><span class="rail-icon"><i>settings</i></span><span>设置</span></a>
      </div>
    </nav>

    <div class="shell">
      <header class="topbar">
        <button id="back" class="icon-btn" type="button" aria-label="返回" hidden><i>arrow_back</i></button>
        <a id="brand" class="brand" href="#/" aria-label="番茄小站">
          <img src="assets/mark.svg" alt="" width="26" height="26">
          <span>番茄小站</span>
        </a>
        <span id="page-title" class="page-title" hidden></span>

        <form class="searchbox" id="search-form" role="search">
          <i class="search-ico">search</i>
          <input id="global-search" type="search" placeholder="搜索书名、作者、短剧" aria-label="搜索" autocomplete="off">
          <button class="icon-btn clear" id="clear-search" type="button" aria-label="清空" hidden><i>close</i></button>
        </form>

        <div class="topbar-actions">
          <button id="theme-btn" class="icon-btn" type="button" aria-label="切换深浅色"><i>dark_mode</i></button>
        </div>
      </header>

      <main id="view" tabindex="-1"></main>

      <nav class="tabbar" aria-label="底部导航">
        <a href="#/" data-nav="home"><span class="nav-icon"><i>auto_stories</i></span><span>首页</span></a>
        <a href="#/category" data-nav="category"><span class="nav-icon"><i>explore</i></span><span>发现</span></a>
        <a href="#/shelf" data-nav="shelf"><span class="nav-icon"><i>bookmarks</i></span><span>书架</span></a>
        <a href="#/settings" data-nav="settings"><span class="nav-icon"><i>settings</i></span><span>设置</span></a>
      </nav>
    </div>
  </div>

  <div id="snackbar" class="snackbar" role="status" aria-live="polite"></div>
  <div id="dialog-host"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
